<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arma tu pizza: elige tamaño, masa e ingredientes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Arma tu pizza</title>
  </head>
  <body>
    <header class="encabezado">
      <span class="marca">🍕 Pizzería</span>
      <h1>Arma tu pizza</h1>
      <p>Elige tamaño, masa y hasta 5 ingredientes. La vemos crecer mientras la armas.</p>
    </header>

    <main class="contenido">
      <section class="panel-pizza" aria-label="Tu pizza">
        <div id="vista-pizza" class="vista-pizza"></div>
        <div class="tarjeta-resumen">
          <h2>Tu pizza</h2>
          <p id="resumen" aria-live="polite"></p>

          <div id="pedido" class="pedido" hidden>
            <div class="fila-pedido">
              <span class="etiqueta">Cantidad</span>
              <div class="cantidad" role="group" aria-label="Cantidad de pizzas">
                <button type="button" id="menos" aria-label="Quitar una pizza">−</button>
                <output id="cantidad" aria-live="polite">1</output>
                <button type="button" id="mas" aria-label="Agregar una pizza">+</button>
              </div>
            </div>
            <div class="fila-pedido fila-total">
              <span class="etiqueta">Total</span>
              <strong id="total" class="total" aria-live="polite"></strong>
            </div>
            <button type="button" id="ordenar" class="boton-principal">Ordenar</button>
            <p id="error-pedido" class="error-pedido" role="alert"></p>
          </div>
        </div>
      </section>

      <form id="armador" class="armador cargando" onsubmit="return false">
        <p id="estado-carga" class="estado-carga" role="status" aria-live="polite">Cargando el menú…</p>

        <fieldset>
          <legend><span class="paso">1</span> Tamaño</legend>
          <div id="opciones-tamano" class="opciones opciones-3"></div>
        </fieldset>

        <fieldset>
          <legend><span class="paso">2</span> Masa</legend>
          <div id="opciones-masa" class="opciones opciones-3"></div>
        </fieldset>

        <fieldset>
          <legend>
            <span class="paso">3</span> Ingredientes
            <span id="contador-ingredientes" class="contador"></span>
          </legend>
          <div id="opciones-ingredientes" class="opciones opciones-ingredientes"></div>
        </fieldset>

        <p id="aviso" class="aviso" role="status" aria-live="polite"></p>
      </form>
    </main>

    <dialog id="confirmacion" class="confirmacion" aria-labelledby="titulo-confirmacion">
      <div class="confirmacion-icono" aria-hidden="true">🍕</div>
      <h2 id="titulo-confirmacion">¡Pedido recibido!</h2>
      <p class="confirmacion-numero">Pedido <strong id="numero-pedido"></strong></p>
      <p id="detalle-pedido" class="confirmacion-detalle"></p>
      <dl class="confirmacion-datos">
        <div>
          <dt>Total</dt>
          <dd id="total-pedido"></dd>
        </div>
        <div>
          <dt>Estado</dt>
          <dd><span id="estado-pedido" class="estado"></span></dd>
        </div>
      </dl>
      <p class="confirmacion-id">Id del pedido: <code id="id-pedido"></code></p>
      <button type="button" id="otra-pizza" class="boton-principal">Armar otra pizza</button>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
